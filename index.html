<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluation Comptable POPSY</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Styles personnalisés -->
    <link rel="stylesheet" href="/style.css" />

    <style>
        :root {
            --primary: #0f172a;
            --secondary: #eab308;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        /* Inputs */
        .input-base {
            width: 100%;
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            text-align: center;
        }
        .input-base:focus {
            outline: 2px solid var(--secondary);
            border-color: transparent;
        }

        /* Couleurs Popsy */
        .bg-yellow-popsy { background-color: #fef9c3; }
        .bg-yellow-50 { background-color: #fefce8; }
        .bg-blue-50 { background-color: #eff6ff; }

        /* CONFIGURATION IMPRESSION */
        @media print {
            @page { margin: 15mm; size: A4; }
            body {
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-size: 12px;
            }

            .print-hidden { display: none !important; }
            .print-block { display: block !important; }

            /* Empêche de couper un exercice au milieu */
            .no-break { break-inside: avoid; page-break-inside: avoid; }
            .page-break { page-break-after: always; }

            /* En-tête répété sur chaque page */
            #print-header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 40px;
                text-align: right;
                font-weight: bold;
                border-bottom: 1px solid #ccc;
                background: white;
                z-index: 1000;
                padding-right: 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            /* Marge pour le contenu sous le header fixe */
            .print-content { margin-top: 50px; width: 100%; }

            /* Force les couleurs */
            .bg-yellow-popsy { background-color: #fef9c3 !important; }
            .bg-blue-50 { background-color: #eff6ff !important; }
            .bg-slate-800 { background-color: #1e293b !important; color: white !important; }

            /* Inputs propres pour l'impression */
            input {
                border: 1px solid #ddd !important;
                background: transparent !important;
                padding: 2px !important;
                color: black !important;
            }
            button { display: none !important; }

            /* Réduire la taille des documents pour économiser le papier */
            .invoice-container {
                transform: scale(0.95);
                transform-origin: top left;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
