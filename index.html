            { id: 29, title: "Entretien Voiture", description: "TVA 50% Déductible.", documents: [{ type: 'INVOICE', title: "Facture 1000", content: { sender: { name: "GARAGE BMW" }, receiver: { name: "OUTISUD" }, details: { number: "1000", date: "27/01/N" }, lines: [{ desc: "Entretien", total: "800" }], totals: { bases: [{ rate: "21%", base: "800", tax: "168" }], totalExcl: "800", totalVat: "168", toPay: "968" } } }], requiredJournals: [{ type: JournalType.ACHAT, defaultDate: "27/01/N" }] },
            { id: 30, title: "Vente Comptoir", description: "Vente au comptoir.", documents: [{ type: 'NOTE', title: "Ticket Caisse", content: { text: "Vente comptoir (21%). Total TVAC: 242 EUR.\nPaiement en liquide." } }], requiredJournals: [ { type: JournalType.VENTE, defaultDate: "28/01/N" }, { type: JournalType.FINANCIER, defaultDate: "28/01/N" } ] },
            { id: 31, title: "Achat Whisky", description: "Frais de réception (TVA non déd).", documents: [{ type: 'INVOICE', title: "Facture 55", content: { sender: { name: "DRINK MARKET" }, receiver: { name: "OUTISUD" }, details: { number: "55", date: "29/01/N" }, lines: [{ desc: "Whisky", total: "200" }], totals: { bases: [{ rate: "21%", base: "200", tax: "42" }], totalExcl: "200", totalVat: "42", toPay: "242" } } }], requiredJournals: [{ type: JournalType.ACHAT, defaultDate: "29/01/N" }] },
            { id: 32, title: "Paiement Loyer", description: "Extrait bancaire.", documents: [{ type: 'BANK_EXTRACT', title: "Extrait 10", content: { transactions: [{ date: "30/01/N", desc: "Loyer", amount: "-1000" }] } }], requiredJournals: [{ type: JournalType.FINANCIER, defaultDate: "30/01/N" }] }
        ];

        // --- 3. COMPOSANTS UI ---

        const EmptyRow = (id) => ({ id, accountNumber: '', declTva: '', codePopsy: '', label: '', debit: '', credit: '' });

        const Modal = ({ title, onClose, children }) => (
            <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm print-hidden">
                <div className="bg-white rounded-lg shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col p-6 overflow-hidden">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b">
                        <h2 className="text-xl font-bold">{title}</h2>
                        <button onClick={onClose}><X size={24}/></button>
                    </div>
                    <div className="overflow-auto flex-grow">{children}</div>
                </div>
            </div>
        );

        const InvoiceViewer = ({ content }) => {
            const senderName = content.sender?.name || "Inconnu";
            const receiverName = content.receiver?.name || "Client";
            return (
                <div className="invoice-container bg-white border shadow p-6 text-sm mb-4 relative overflow-hidden break-inside-avoid">
                    <div className="absolute top-0 right-0 bg-gray-200 text-xs px-2 py-1 text-gray-500">FACTURE</div>
                    <div className="flex justify-between mb-6">
                        <div className="w-1/2">
                            <h3 className="font-bold text-lg">{senderName}</h3>
                            <p className="text-xs">{content.sender?.vat}</p>
                        </div>
                        <div className="border-2 border-gray-300 p-3 w-1/3 rounded bg-gray-50">
                            <p className="text-xs text-gray-500 uppercase tracking-wide">Destinataire</p>
                            <h3 className="font-bold">{receiverName}</h3>
                        </div>
                    </div>
                    <div className="mb-4 font-bold border-b pb-1 flex justify-between">
                        <span>Facture {content.details?.number}</span>
                        <span>{content.details?.date}</span>
                    </div>
                    <table className="w-full mb-4">
                        <thead><tr className="border-b text-gray-500"><th className="text-left font-normal">Libellé</th><th className="text-right font-normal">Montant</th></tr></thead>
                        <tbody>
                            {content.lines?.map((l, i) => <tr key={i}><td className="py-1">{l.desc}</td><td className="text-right font-mono">{l.total}</td></tr>)}
                        </tbody>
                    </table>
                    <div className="flex justify-end">
                        <div className="w-2/3 border-t pt-2">
                            {content.totals?.bases && content.totals.bases.map((b,i)=> (
                                <div key={i} className="flex justify-between text-xs text-gray-500">
                                    <span>Base {b.rate}: {b.base}</span>
                                    <span>TVA: {b.tax}</span>
                                </div>
                            ))}
                            <div className="flex justify-between mt-1"><span>Total HT:</span><span>{content.totals?.totalExcl}</span></div>
                            <div className="flex justify-between"><span>Total TVA:</span><span>{content.totals?.totalVat}</span></div>
                            <div className="text-right font-bold text-lg bg-yellow-50 p-2 border-t-2 border-slate-800 mt-2">A Payer: {content.totals?.toPay} €</div>
                        </div>
                    </div>
                </div>
            );
        };

        const BankExtractViewer = ({ content }) => (
            <div className="bg-blue-50 border border-blue-200 p-4 mb-4 text-sm font-mono shadow-sm break-inside-avoid">
                <div className="font-bold text-blue-900 border-b border-blue-300 mb-2 flex justify-between">
                    <span>{content.title}</span>
                </div>
                {content.transactions.map((t, i) => (
                    <div key={i} className="flex justify-between bg-white p-2 mb-1 border rounded">
                        <span>{t.date} - {t.desc}</span>
                        <span className={String(t.amount).includes('-') ? 'text-red-600' : 'text-green-600 font-bold'}>{t.amount}</span>
                    </div>
                ))}
            </div>
        );

        const DocumentViewer = ({ doc }) => {
            if (doc.type === 'INVOICE') return <InvoiceViewer content={doc.content} />;
            if (doc.type === 'BANK_EXTRACT') return <BankExtractViewer content={doc.content} />;
            return <div className="bg-yellow-100 border-l-4 border-yellow-400 p-4 text-center italic text-yellow-900 mb-4 rounded shadow-sm break-inside-avoid">{doc.content.text}</div>;
        };

        const JournalTable = ({ type, defaultDate, rows, setRows, readOnly }) => {
            const [date, setDate] = useState(defaultDate);
            useEffect(() => setDate(defaultDate), [defaultDate]);
            useEffect(() => { if (!readOnly && rows.length === 0) setRows([EmptyRow('1'), EmptyRow('2'), EmptyRow('3')]); }, []);

            const update = (idx, field, val) => {
                if(readOnly) return;
                const newRows = [...rows];
                newRows[idx][field] = val;
                setRows(newRows);
            };

            const addRow = () => { if(!readOnly) setRows([...rows, EmptyRow(Date.now())]); };
            const removeRow = (id) => { if(!readOnly) setRows(rows.filter(r => r.id !== id)); };

            return (
                <div className="bg-white rounded shadow-lg border mb-8 overflow-hidden break-inside-avoid">
                    <div className="bg-slate-800 text-white p-2 flex justify-between items-center print:bg-slate-800 print:text-white print:border-b-0">
                        <h3 className="font-bold">{type}</h3>
                        <input value={date} onChange={e=>setDate(e.target.value)} disabled={readOnly} className="text-black text-center w-24 rounded px-1" />
                    </div>
                    <table className="w-full text-sm">
                        <thead className="bg-gray-100 border-b">
                            <tr>
                                <th className="p-2 w-20">Cpte</th><th className="p-2 w-16">TVA</th><th className="p-2 w-16">Code</th>
                                <th className="p-2 text-left">Libellé</th>
                                <th className="p-2 w-24 bg-yellow-popsy text-right">Débit</th><th className="p-2 w-24 bg-blue-50 text-right">Crédit</th>
                                {!readOnly && <th className="p-2 w-8"></th>}
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map((r, i) => (
                                <tr key={r.id} className="border-b">
                                    <td className="p-1"><input className="input-base bg-yellow-popsy" value={r.accountNumber} onChange={e=>update(i,'accountNumber',e.target.value)} disabled={readOnly}/></td>
                                    <td className="p-1"><input className="input-base bg-yellow-popsy" value={r.declTva} onChange={e=>update(i,'declTva',e.target.value)} disabled={readOnly}/></td>
                                    <td className="p-1"><input className="input-base bg-yellow-popsy" value={r.codePopsy} onChange={e=>update(i,'codePopsy',e.target.value)} disabled={readOnly}/></td>
                                    <td className="p-1"><input className="input-base text-left" value={r.label} onChange={e=>update(i,'label',e.target.value)} disabled={readOnly}/></td>
                                    <td className="p-1 bg-yellow-50"><input className="input-base bg-yellow-popsy text-right" value={r.debit} onChange={e=>update(i,'debit',e.target.value)} disabled={readOnly}/></td>
                                    <td className="p-1 bg-blue-50"><input className="input-base bg-yellow-popsy text-right" value={r.credit} onChange={e=>update(i,'credit',e.target.value)} disabled={readOnly}/></td>
                                    {!readOnly && <td className="p-1 text-center"><button onClick={()=>removeRow(r.id)} className="text-red-500"><Trash2 size={16}/></button></td>}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    {!readOnly && <div className="p-2 bg-gray-50"><button onClick={addRow} className="text-blue-600 text-xs flex items-center gap-1"><Plus size={14}/> Ajouter ligne</button></div>}
                </div>
            );
        };

        const PlanComptableModal = ({ onClose }) => {
            const [search, setSearch] = useState('');
            const filtered = PLAN_COMPTABLE.filter(i => i.account.includes(search) || i.label.toLowerCase().includes(search.toLowerCase()));
            return (
                <Modal title="Plan Comptable" onClose={onClose}>
                    <input autoFocus placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full border p-2 mb-4 rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">{filtered.map(c => <div key={c.account} className="border-b p-1 flex gap-2 hover:bg-gray-50"><span className="font-bold w-12 text-blue-800">{c.account}</span><span>{c.label}</span></div>)}</div>
                </Modal>
            );
        };

        const DeclarationTvaModal = ({ onClose }) => (
            <Modal title="Déclaration TVA" onClose={onClose}>
                <div className="grid md:grid-cols-2 gap-4">
                    {Object.entries(DECLARATION_TVA).map(([cadre, items]) => (
                        <div key={cadre} className="border rounded shadow-sm">
                            <div className="bg-gray-100 font-bold p-2 uppercase border-b">{cadre}</div>
                            {items.map(i => <div key={i.code} className="flex border-t"><span className="w-16 bg-gray-50 border-r p-2 font-bold text-center flex items-center justify-center">{i.code}</span><span className="p-2 flex-1">{i.label}</span></div>)}
                        </div>
                    ))}
                </div>
            </Modal>
        );

        const CodesPopsyModal = ({ onClose }) => (
            <Modal title="Codes Popsy" onClose={onClose}>
                <div className="grid md:grid-cols-2 gap-4">
                    <div><h3 className="font-bold bg-yellow-200 p-2 mb-2 rounded">Achats</h3>{CODES_POPSY.achats.map(c => <div key={c.code} className="flex text-sm border-b hover:bg-gray-50"><span className="w-16 font-bold bg-yellow-100 p-1 flex items-center justify-center border-r">{c.code}</span><span className="p-1 flex-1">{c.label}</span></div>)}</div>
                    <div><h3 className="font-bold bg-orange-200 p-2 mb-2 rounded">Ventes</h3>{CODES_POPSY.ventes.map(c => <div key={c.code} className="flex text-sm border-b hover:bg-gray-50"><span className="w-16 font-bold bg-orange-100 p-1 flex items-center justify-center border-r">{c.code}</span><span className="p-1 flex-1">{c.label}</span></div>)}</div>
                </div>
            </Modal>
        );

        // --- 4. APP ---
        const App = () => {
            const [email, setEmail] = useState('');
            const [auth, setAuth] = useState(false);
            const [levels, setLevels] = useState([]);
            const [idx, setIdx] = useState(0);
            
            // Stockage : [LevelId] -> [JournalIdx] -> [Rows]
            const [answers, setAnswers] = useState({});
            
            const [finished, setFinished] = useState(false);
            const [modal, setModal] = useState(null);

            useEffect(() => {
                const l1 = RAW_LEVELS.find(l => l.id===1);
                const others = shuffleArray(RAW_LEVELS.filter(l => l.id!==1));
                setLevels([l1, ...others]);
            }, [auth]);

            const current = levels[idx];

            const shuffleArray = (array) => {
                const newArr = [...array];
                for (let i = newArr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
                }
                return newArr;
            };

            const handleNext = () => {
                // Sauvegarde automatique déjà faite via onChange
                if (idx < levels.length - 1) {
                    setIdx(idx + 1);
                    window.scrollTo(0,0);
                } else {
                    setFinished(true);
                }
            };

            const restart = () => {
                setFinished(false); setIdx(0); setAnswers({}); setAuth(false);
            };

            if(!auth) return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-xl max-w-md w-full shadow-2xl">
                        <h1 className="text-2xl font-bold mb-4 flex items-center gap-2"><BookOpen className="text-yellow-500"/> Evaluation POPSY</h1>
                        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="prénom.nom@istlm.org" className="w-full border p-3 rounded mb-4" />
                        <button onClick={()=>{if(email.includes('@')) setAuth(true)}} className="w-full bg-slate-800 text-white p-3 rounded font-bold">Commencer l'évaluation</button>
                    </div>
                </div>
            );

            if(finished) {
                return (
                    <div className="min-h-screen bg-slate-50 p-8 flex flex-col items-center">
                        {/* En-tête visible uniquement à l'impression */}
                        <div id="print-header" className="print-block hidden">
                            <span>Évaluation Comptable POPSY</span>
                            <span>Élève: <strong>{email}</strong></span>
                        </div>
                        
                        {/* Vue Ecran Fin */}
                        <div className="bg-white p-8 rounded-xl shadow-xl max-w-2xl w-full text-center print-hidden mb-8">
                            <h1 className="text-3xl font-bold mb-4">Évaluation Terminée</h1>
                            <p className="mb-8">Vous avez complété les 31 exercices. Cliquez ci-dessous pour imprimer votre dossier complet.</p>
                            <div className="flex justify-center gap-4">
                                <button onClick={()=>window.print()} className="bg-blue-600 text-white px-6 py-2 rounded flex items-center gap-2"><Printer size={20}/> Imprimer le dossier</button>
                                <button onClick={restart} className="bg-slate-700 text-white px-6 py-2 rounded flex items-center gap-2"><RotateCcw size={20}/> Recommencer</button>
                            </div>
                        </div>

                        {/* Contenu Imprimable (Dossier Complet) */}
                        <div className="w-full max-w-4xl print-content">
                            {levels.map((level, i) => (
                                <div key={level.id} className="mb-12 print-block no-break border-b-2 border-dashed border-gray-300 pb-8 last:border-0 page-break">
                                    <div className="mb-6 border-l-4 border-slate-800 pl-4 py-2 bg-gray-100 break-inside-avoid">
                                        <h2 className="text-xl font-bold">Exercice {i+1} : {level.title}</h2>
                                        <p className="text-sm text-gray-600 italic">{level.description}</p>
                                    </div>
                                    
                                    {/* 1. DOCUMENT (ENONCE) */}
                                    <div className="mb-6 break-inside-avoid">
                                        {level.documents.map((d, docIdx) => <DocumentViewer key={docIdx} doc={d} />)}
                                    </div>
                                    
                                    {/* 2. REPONSE ELEVE */}
                                    <div className="break-inside-avoid">
                                        <h3 className="font-bold text-sm uppercase text-slate-500 mb-2 border-b">Vos écritures :</h3>
                                        {level.requiredJournals.map((j, jIdx) => (
                                            <JournalTable 
                                                key={jIdx} 
                                                type={j.type} 
                                                defaultDate={j.defaultDate} 
                                                rows={answers[level.id]?.[jIdx] || []} 
                                                setRows={()=>{}} 
                                                readOnly={true} 
                                            />
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if(!current) return <div>Chargement...</div>;

            return (
                <div className="min-h-screen flex flex-col pb-20 print:pb-0">
                    <div className="bg-slate-900 text-white p-4 sticky top-0 z-40 print-hidden flex justify-between items-center shadow-lg">
                        <div className="font-bold flex items-center gap-2"><BookOpen className="text-yellow-500"/> Ex {idx+1}/{levels.length}</div>
                        <div>{email}</div>
                    </div>

                    <div className="container mx-auto p-4 flex flex-col lg:flex-row gap-8 print-block">
                        <div className="lg:w-1/2">
                            <div className="bg-white p-4 rounded shadow mb-4">
                                <h2 className="text-xl font-bold">{current.title}</h2>
                                <p className="text-gray-600">{current.description}</p>
                            </div>
                            {current.documents.map((d,i) => <DocumentViewer key={i} doc={d} />)}
                        </div>
                        <div className="lg:w-1/2">
                            {current.requiredJournals.map((j, i) => (
                                <JournalTable 
                                    key={current.id+'-'+i} 
                                    type={j.type} 
                                    defaultDate={j.defaultDate} 
                                    rows={answers[current.id]?.[i]||[]} 
                                    setRows={r=>setAnswers({...answers, [current.id]: {...answers[current.id], [i]: r}})} 
                                    readOnly={false}
                                />
                            ))}
                        </div>
                    </div>

                    <div className="fixed bottom-0 w-full bg-white border-t p-3 print:hidden z-50 flex justify-between items-center shadow-inner">
                        <div className="flex gap-2">
                            <button onClick={()=>setModal('PLAN')} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded text-sm font-bold flex items-center gap-2"><List size={16}/> Plan</button>
                            <button onClick={()=>setModal('TVA')} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded text-sm font-bold flex items-center gap-2"><FileText size={16}/> TVA</button>
                            <button onClick={()=>setModal('CODES')} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded text-sm font-bold flex items-center gap-2"><Grid size={16}/> Popsy</button>
                        </div>
                        <div className="flex gap-2">
                            <button disabled={idx===0} onClick={()=>setIdx(idx-1)} className="p-2 bg-slate-200 rounded disabled:opacity-50"><ChevronLeft/></button>
                            <button onClick={handleNext} className="px-6 py-2 bg-yellow-500 text-slate-900 rounded font-bold hover:bg-yellow-400 flex items-center gap-2">
                                {idx < levels.length - 1 ? 'Exercice Suivant' : 'Terminer'} <ChevronRight size={18}/>
                            </button>
                        </div>
                    </div>

                    {modal && <Modal title={modal === 'PLAN' ? 'Plan Comptable' : modal === 'TVA' ? 'Déclaration TVA' : 'Codes Popsy'} onClose={()=>setModal(null)}>
                        {modal==='PLAN' && <PlanComptableModal onClose={()=>setModal(null)} />}
                        {modal==='CODES' && <CodesPopsyModal onClose={()=>setModal(null)} />}
                        {modal==='TVA' && <DeclarationTvaModal onClose={()=>setModal(null)} />}
                    </Modal>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
